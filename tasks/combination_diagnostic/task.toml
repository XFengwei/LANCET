[task]
name = "combination_diagnostic"

[measurement_sets]
combined_12m = "data/reduction/alma/7MTM2TM1/cont/ms/IRDC316.8.TM1TM2.bin.combselfcal"
configuration_c5 = "data/reduction/alma/7MTM2TM1/cont/ms/IRDC316.8.TM1.bin.combselfcal"
configuration_c2 = "data/reduction/alma/7MTM2TM1/cont/ms/IRDC316.8.TM2.bin.combselfcal"
aca_7m = "data/reduction/alma/7MTM2TM1/cont/ms/IRDC316.8.ACA.bin.selfcal"

[images]
aca_pbcor = "results/prepare_continuum_images/converted/7M/IRDC316.8.ACA.p1.cont.image.pbcor.MJysr.fits"
aca_uncorrected = "results/prepare_continuum_images/converted/7M/IRDC316.8.ACA.p1.cont.image.MJysr.fits"
twelve_m_pbcor = "results/prepare_continuum_images/converted/TM2TM1/IRDC316.8.TM1TM2.selfcal.cont.image.tt0.pbcor.MJysr.fits"
combined_pbcut = "results/prepare_continuum_images/converted/7MTM2TM1/IRDC316.8.7MTM2TM1.robust0.5.clean.drogdeg.pbcut.MJysr.fits"
allscale_sky = "data/delivered/alma/TP7MTM2TM1/cont/allscale_combined_v3_dust_ff.MJysr.rp.fits"

[regions]
successful_combinations = "region/success.reg"

[outputs]
root = "results/combination_diagnostic"

[reduction_inputs]
combination_script = "data/reduction/alma/7MTM2TM1/cont/ms/combine_cont.sh"
total_power = "data/reduction/alma/TP7MTM2TM1/cont/totalpower_dust_ff.fits"
interferometer = "data/reduction/alma/TP7MTM2TM1/cont/interferometer_dust_ff.fits"
feather_1p0 = "data/reduction/alma/TP7MTM2TM1/cont/feather_casa_backend/feather_combined_dust_ff.fits"
feather_2p0 = "data/reduction/alma/TP7MTM2TM1/cont/feather_casa_backend/feather_combined_dust_ff_sdfactor2p0.fits"
feather_2p5 = "data/reduction/alma/TP7MTM2TM1/cont/feather_casa_backend/feather_combined_dust_ff_sdfactor2p5.fits"
feather_3p0 = "data/reduction/alma/TP7MTM2TM1/cont/feather_casa_backend/feather_combined_dust_ff_sdfactor3p0.fits"

[uv_plot]
round_decimals = 1
chunk_rows = 250000
zoom_limit_metres = 70.0
output_formats = ["pdf", "svg", "png"]
dpi = 300

[visibility_profile]
chunk_rows = 20000
uv_min_klambda = 0.1
uv_max_klambda = 3000.0
radial_bins = 80
zoom_max_klambda = 60.0
reference_frequency_ghz = 225.0
output_formats = ["pdf", "svg", "png"]
dpi = 300

[overlap_tests]
uv_edges_klambda = [8.0, 10.0, 12.0, 15.0, 18.0, 22.0, 26.0, 32.0]
read_max_klambda = 40.0
maximum_pair_separation_arcsec = 5.0
strict_pair_separation_arcsec = 2.0
orientation_sectors = 8
maximum_time_pair_gap_seconds = 30.0
model_pixel_arcsec = 0.5
model_patch_arcsec = 256.0
model_padding_factor = 2
pb_reference_frequency_ghz = 225.0
pb_12m_fwhm_arcsec = 26.0
pb_7m_fwhm_arcsec = 43.0
bootstrap_repeats = 500
random_seed = 3168

[image_comparison_plot]
center_ra_deg = 221.2918
center_dec_deg = -59.8059
width_deg = 0.11666666666666667
height_deg = 0.06666666666666667
vmin_mjysr = -20.0
vmax_mjysr = 500.0
colormap = "mako"
scalebar_length_deg = 0.02
scalebar_label = "1 pc"
output_formats = ["pdf", "svg", "png"]
dpi = 300

[beam_match]
residual_reference = "aca_uncorrected"
output_format = "png"
dpi = 200

[figure1]
width_inches = 7.2440944882
height_inches = 7.2440944882
output_formats = ["pdf", "svg", "png"]
dpi = 600
tp_minimum_response = 0.1
tp_display_scale = 1.0
# 7 m on the 12 m PB via the 12m+7m image; TP shown with and without its beam.
amplitude_source = "amplitude_alignment"
amplitude_uv_edges_klambda = [4.8, 6.0, 7.0, 8.0, 10.0, 12.0, 15.0, 18.0, 22.0, 26.0, 32.0, 40.0, 50.0, 65.0, 85.0, 110.0, 145.0, 190.0, 250.0, 330.0, 430.0, 560.0, 730.0, 960.0, 1050.0]

[pointing_range]
# Display normalization only; disclose in the manuscript caption.
tp_display_scale = 2.7

[dirty_beam]
# R4b: rerun of Shuting Lin's MIRIAD workflow (script.zip) through the final invert;
# robust 0.5 as the paper image. The reference Gaussian is the paper restoring beam.
psf_fits = "data/reduction/alma/7MTM2TM1/cont/miriad_run/work/combined.robust0.5.psf.fits"
imfit_log = "data/reduction/alma/7MTM2TM1/cont/miriad_run/work/combined.robust0.5.psf.imfit.log"
# restor fits (bmaj, bmin arcsec; pa deg) of the rerun vs delivered images, for the record.
rerun_restor_beams = { robust0_5 = [0.707, 0.600, 47.2], robust1_0 = [0.772, 0.681, 47.7], robust2_0 = [0.792, 0.704, 47.8] }
paper_image = "data/delivered/alma/7MTM2TM1/cont/IRDC316.8.7MTM2TM1.robust0.5.clean.fits"
zoom_half_arcsec = 1.5
# MIRIAD restor fits the Gaussian to the central 11x11 beam pixels (restor.for, beamFit NP=11).
restor_fit_box_pixels = 11
profile_plot_max_arcsec = 3.0
profile_max_arcsec = 40.0 # radial profile CSV and volume ratios
volume_ratio_radii_arcsec = [1.0, 2.0, 5.0, 10.0, 20.0, 40.0]
width_inches = 3.4645669291
output_formats = ["pdf", "svg", "png"]
dpi = 600

[joint_image_comparison]
casa = "results/prepare_continuum_images/converted/7MTM2TM1_casa/IRDC316.8.TM1TM2ACA.selfcal.cont.image.tt0.pbcor.MJysr.fits"
miriad = "results/prepare_continuum_images/converted/7MTM2TM1/IRDC316.8.7MTM2TM1.robust0.5.clean.drogdeg.pbcut.MJysr.fits"
casa_pb = "data/delivered/alma/7MTM2TM1/cont/casa/IRDC316.8.TM1TM2ACA.selfcal.cont.pb.tt0.fits"
minimum_pb = 0.2
cutout_arcsec = 100.0
region_centres_deg = [[221.244, -59.8020], [221.359, -59.8227]]
region_names = ["Central", "South"]
width_inches = 7.2440944882

# Forward test: sky images through the native 7 m PB at measured ACA uv points.
[aca_forward_test]
ddids = [0, 7]
uv_edges_klambda = [4.8, 6.0, 7.0, 8.0, 9.165, 10.5, 12.0, 14.0, 17.0, 20.0, 25.0, 30.0]
minimum_support = 0.95
bootstrap_repeats = 500
random_seed = 3168
figure_selection = "interior_pairs"
output_formats = ["pdf", "png"]

[aca_forward_test.sky_models]
aca_only = { source = "images.aca_pbcor", label = "ACA-only image" }
interferometer = { source = "reduction_inputs.interferometer", label = "12m+7m (no TP)", tp_scale = 0.0, tp_beam_transfer = true }
feather_1p0 = { source = "reduction_inputs.feather_1p0", label = "Feather, TP x1", tp_scale = 1.0, tp_beam_transfer = true }
feather_2p0 = { source = "reduction_inputs.feather_2p0", label = "Feather, TP x2", tp_scale = 2.0 }
feather_2p5 = { source = "reduction_inputs.feather_2p5", label = "Feather, TP x2.5", tp_scale = 2.5 }
feather_3p0 = { source = "reduction_inputs.feather_3p0", label = "Feather, TP x3", tp_scale = 3.0 }
jcomb = { source = "images.allscale_sky", label = "J-comb (delivered)" }

# TP and interferometer amplitudes on the matched 12 m PB, TP beam removed.
[amplitude_alignment]
sky_model = "images.combined_pbcut"
tp_minimum_response = 0.1
continuous_min_klambda = 1.0
continuous_points = 60
overlap_uv_edges_klambda = [4.8, 5.4, 6.0, 6.6, 7.2, 7.8, 8.4, 9.165]
bootstrap_repeats = 500
random_seed = 3168
width_inches = 7.2440944882
height_inches = 2.55
output_formats = ["pdf", "svg", "png"]
dpi = 600

[pointing_coverage]
# Pointing centres of each array (FIELD tables of the measurement sets above) on the MIRIAD
# mosaic gain and the CASA 12m+7m mosaic pb. Runs on its own inputs, not resolve_task_paths.
gain = "data/delivered/alma/7MTM2TM1/cont/IRDC316.8.7MTM2TM1.robust0.5.gain.fits"
pb = "data/delivered/alma/7MTM2TM1/cont/casa-archived/IRDC316.8.TM1TM2ACA.selfcal.cont.pb.tt0.fits"
twelve_m_sets = ["configuration_c5", "configuration_c2"]
seven_m_sets = ["aca_7m"]
frequency_ghz = 224.4
beam_factor = 1.13
duplicate_tolerance_arcsec = 1.0
pb_levels = [0.5, 0.2, 0.1]
display_step = 8
statistics_step = 4
pb_bin_edges = [0.05, 0.09, 0.11, 0.19, 0.21, 0.30, 0.35, 0.45, 0.48, 0.50, 0.52, 0.55, 0.70, 1.01]
regions = [
  { name = "north", title = "Northern mosaic", centre = "14:44:31.5 -59:45:00", size_arcsec = [330, 330] },
  { name = "centre_south", title = "Central and southern mosaic", centre = "14:45:10.0 -59:48:30", size_arcsec = [480, 270] },
]
