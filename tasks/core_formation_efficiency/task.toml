[task]
name = "core_formation_efficiency"

[inputs]
physical_catalogue = "results/core_physical_properties/tables/core_physical_properties.ecsv"
source_catalogue = "results/source_catalogue/tables/source_catalogue.ecsv"
fragment_ellipse_catalogue = "data/extraction/astrodendro/my_dendrogram.dat"
fragment_mass_catalogue = "data/extraction/astrodendro/my_catalog.dat"
fragment_label_mask = "data/extraction/astrodendro/my_mask_idx.fits"
# Fragment selection: whole leaf footprint at MIRIAD mosaic pb >= 0.2 (replaces
# the removed CASA primary beam; same 49 of 65 fragments).
selection_gain = "data/delivered/alma/continuum/IRDC316.8.7MTM2TM1.robust0.5.cont.pb.fits"
# Overlay figure backgrounds, converted to MJy/sr in the task. The 12m+7m map is the MIRIAD
# flat-noise image (sky x pb), replacing the former CASA-pb "pbant" product.
high_resolution_continuum = "data/delivered/alma/continuum/IRDC316.8.7MTM2TM1.robust0.5.cont.clean.flatnoise.fits"
low_resolution_continuum = "data/delivered/alma/continuum/IRDC316.8.7M.robust0.5.cont.image.fits"

[references]
# This published catalogue is checked during inspection only. The adopted
# fragment masses below are scientific inputs and are not calculated from it.
paper1_fragment_catalogue = "data/delivered/paper1/PaperI_table2.fit"

[outputs]
root = "results/core_formation_efficiency"

[dust_opacity]
# Optically thin dust masses scale inversely with opacity. Paper I fragment
# masses are multiplied by 0.9 / 0.5 = 1.8 for consistency with this work.
paper1_cm2_per_g = 0.9
adopted_cm2_per_g = 0.5

[selection]
minimum_gain = 0.2

[regions.young]
label = "Young"
code = "Y"
cloud_mass_msun = 11000.0
paper1_fragment_mass_msun = 50.0
fragment_count = 12

[regions.intermediate]
label = "Intermediate"
code = "I"
cloud_mass_msun = 17000.0
paper1_fragment_mass_msun = 391.0
fragment_count = 37

[regions.evolved]
label = "Evolved"
code = "E"
cloud_mass_msun = 8000.0
paper1_fragment_mass_msun = 766.0
fragment_count = 16


[overlay]
width_arcsec = 100.0
height_arcsec = 100.0
image_vmin = -21.0
contour_levels_mjysr = [6.0, 24.0, 96.0, 384.0]

[[panels]]
key = "young"
label = "Young"
center_ra_deg = 221.0820
center_dec_deg = -59.7394
image_vmax = 400.0

[[panels]]
key = "intermediate"
label = "Intermediate"
center_ra_deg = 221.23695
center_dec_deg = -59.80308
image_vmax = 400.0

[[panels]]
key = "evolved"
label = "Evolved"
center_ra_deg = 221.3468
center_dec_deg = -59.8230
image_vmax = 800.0

[figures]
formats = ["pdf", "png"]
dpi = 200

# Temperature-prior sampling of the regional core masses (stage
# `temperature_sampling`, Paper II Fig. 9 overlay; moved from the R8d referee
# diagnostic). Diagnostic only: the adopted catalogues keep Tenv. Output:
# results/core_formation_efficiency/temperature_sampling/.
[temperature_sampling]
sample_count = 100000
random_seed = 20261101
upper_temperatures_k = [30.0, 40.0, 50.0] # Young, Intermediate, Evolved
# For global peak-brightness percentile q: F ~ Beta(1+2q, 3-2q).
brightness_strength = 2.0
# Same values as [physics] in tasks/core_physical_properties/task.toml.
frequency_ghz = 223.8
beam_major_arcsec = 0.71
beam_minor_arcsec = 0.60
