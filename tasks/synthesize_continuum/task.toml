[task]
name = "synthesize_continuum"

[inputs]
dust_230ghz = "data/delivered/paper1/TP_SEDsynthetic230GHz_cont.fits"
freefree_230ghz = "results/construct_freefree_model/Te_8000K/ff230_map_smoothed_18arcsec_regrid2dust.fits"
simba_250ghz = "data/delivered/archive/infrared/SIMBA_1.2mm.fits"

[outputs]
root = "results/synthesize_continuum"

[model]
reference_frequency_ghz = 230.0
frequencies_ghz = [230.0, 250.0]
dust_spectral_index = 3.8
freefree_spectral_index = -0.1
missing_freefree_value_jy_per_beam = 0.0

[beam]
model_fwhm_arcsec = 18.0
simba_fwhm_arcsec = 24.0

[simba]
invalid_floor = -100000.0
flux_scale = 0.20
reprojection_method = "hcongrid"

[plot]
output_formats = ["pdf", "png"]
dpi = 200
colormap = "mako"
crop_pixels = [100.0, 250.0]
ra_tick_spacing_arcmin = 5.0
scalebar_length_deg = 0.02
scalebar_label = "1 pc"
contour_smoothing_sigma_pixels = 1.0

[plot.component_230ghz]
vmin_jy_per_beam = 0.05
vmax_jy_per_beam = 2.0
contour_levels_jy_per_beam = [0.20, 0.35, 0.70, 1.05, 1.40, 1.75]

[plot.simba_250ghz]
vmin_jy_per_beam = 0.05
vmax_jy_per_beam = 3.0
contour_levels_jy_per_beam = [0.25, 0.50, 1.0, 2.0, 3.0, 3.5]

[plot.sed_demonstration]
frequency_range_ghz = [1.0, 10000.0]
frequency_samples = 1500
electron_temperature_k = 8000.0
emission_measure_pc_cm6 = 1.0e8
source_fwhm_arcsec = [4.0, 4.0]
dust_temperature_k = 25.0
dust_emissivity_index = 1.8
dust_reference_frequency_ghz = 230.0
dust_reference_flux_jy = 3.5
radio_frequencies_ghz = [1.2, 6.0, 15.0]
far_infrared_wavelengths_um = [500.0, 350.0, 250.0, 160.0, 100.0, 70.0]
prediction_frequency_ghz = 230.0
