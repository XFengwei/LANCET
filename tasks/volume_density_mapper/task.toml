[task]
name = "volume_density_mapper"

[inputs]
surface_density = "results/column_density/maps/surface_density_allscale.fits"
# Footprint only (finite pixels): MIRIAD pb >= 0.2, replacing the former CASA-pb cut.
alma_footprint = "data/delivered/alma/continuum/IRDC316.8.7MTM2TM1.robust0.5.cont.clean.flatnoise.pb0.2.fits"
primary_beam = "data/delivered/alma/continuum/IRDC316.8.7MTM2TM1.robust0.5.cont.pb.fits"
low_resolution_surface_density = "results/column_density/prepared/surface_density_lowres.fits"

[outputs]
root = "results/volume_density_mapper"

[geometry]
center_ra = "14:44:58.79"
center_dec = "-59:48:01.94"
pilot_size_pixels = 1500
distance_pc = 2800.0

[resolution]
high_arcsec = 0.65
low_arcsec = 18.0
transition_buffer_arcsec = 18.0

[primary_beam]
minimum_response = 0.20

[model]
mean_molecular_weight = 2.8
padding = false

[full_map]
high_resolution_rebin = 3
