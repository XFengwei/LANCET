[task]
name = "plot_allscale_continuum"

[inputs]
# J-comb 12m+7m+TP (TP factor 1.0), Jy/beam, converted to MJy/sr in the task.
# The extended products continue into the TP-only area beyond the mosaic.
combined_continuum = "data/delivered/alma/continuum/IRDC316.8.TP7MTM2TM1.robust0.5.cont.image.pbcor.extended.fits"
dust_continuum = "data/delivered/alma/continuum/IRDC316.8.TP7MTM2TM1.robust0.5.cont_dust.image.pbcor.extended.fits"
synthetic_continuum = "results/synthesize_continuum/model/continuum_224GHz.fits"
# MIRIAD mosaic pb; its 0.2 contour is drawn on the annotated views.
primary_beam = "data/delivered/alma/continuum/IRDC316.8.7MTM2TM1.robust0.5.cont.pb.fits"

[primary_beam]
minimum_response = 0.20

[outputs]
root = "results/plot_allscale_continuum"

[view]
center_ra_deg = 221.2346
center_dec_deg = -59.7738
width_deg = 0.19166666666666668
height_deg = 0.13666666666666666
figure_width_inches = 10.0
figure_height_inches = 6.0
scalebar_length_deg = 0.02
scalebar_label = "1 pc"
resolution_label = "0.65 arcsec = 1820 au"

# MJy/sr (author, 2026-11-20). Paper II (v3 map, TP about 3.1 x): -21 / 233 / 1500.
# -20 is about -2 sigma (9.2 MJy/sr).
[styles.allscale]
background_vmin = -20.0
transition = 50.0
highlight_vmax = 800.0

# Paper II v3 Fig. 3 (author, 2026-11-20). View of the combined map (stage `sqrt`): one colour bar,
# square-root stretch, MJy/sr; values outside [vmin, vmax] are clipped.
[styles.sqrt]
vmin = 0.0
vmax = 1200.0
colour_map = "inferno"
stretch = "sqrt"
# Colour of blank pixels (outside the TP model).
blank_colour = "black"

# MJy/sr: the former Jy/beam limits -0.02 / 0.5 / 2.4 times 114.61 MJy/sr per
# Jy/beam of the 18.1" TP beam, so the view is unchanged.
[styles.synthetic]
background_vmin = -2.292
transition = 57.31
highlight_vmax = 275.07

[figures]
annotated_formats = ["pdf", "png"]
clean_formats = ["png"]
combined_annotated_dpi = 200
dust_annotated_dpi = 300
clean_dpi = 600
