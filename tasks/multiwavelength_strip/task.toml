[task]
name = "multiwavelength_strip"

[outputs]
root = "results/multiwavelength_strip"

[grid]
# Rotated TAN grid whose long axis follows the LANCET filament spine. The spine
# runs 32 deg above the west (decreasing RA) axis of a north-up image, i.e. at
# an astronomical position angle of 270 + 32 = 302 deg east of north. The box
# centre is the midpoint of the 12m+7m mosaic footprint along/across the spine
# (221.20544, -59.78962), shifted 0.30 arcmin towards PA 32 deg (strip "up")
# so the spine, which sits ~0.27 arcmin above that midpoint, is centred.
center_ra_deg = 221.21071
center_dec_deg = -59.78538
long_axis_pa_deg = 302.0
width_arcmin = 14.0
height_arcmin = 4.0
pixel_scale_arcsec = 0.3

# Panels from top to bottom. Every input is reprojected onto the same grid.
# kind = "vvv": seamless J/H/Ks mosaic built with tasks/vvv_mosaic settings.
# kind = "rgb": three images as [red, green, blue].
# kind = "single": one image shown with a colormap.
[[panels]]
name = "nir"
label = "VVV  $J$, $H$, $K_s$"
kind = "vvv"
vvv_config = "tasks/vvv_mosaic/task.toml"

[[panels]]
name = "mir"
label = "Spitzer 3.6, 5.8 µm + Herschel 70 µm"
kind = "rgb"
inputs = [
    "data/delivered/archive/infrared/image_HHLI-PACS070.fits",
    "data/delivered/archive/infrared/image_GLIMPSE-IRAC3.fits",
    "data/delivered/archive/infrared/image_GLIMPSE-IRAC1.fits",
]
# The infrared-dark spine is only ~2x fainter than the diffuse background,
# both near the bottom of each band's range. Black sits just below the dark
# spine and a strong asinh lifts the background so the cloud shows in
# silhouette.
low_percentile = [0.2, 0.2, 0.2]
high_percentile = [99.95, 99.95, 99.9]
asinh_softening = [0.003, 0.004, 0.006]
weights = [1.0, 0.75, 0.8]
# Annotations: offsets in arcmin from the strip centre, x along the strip
# (right = PA 302 deg, north-west), y across it (up = PA 32 deg).
[[panels.annotations]]
kind = "box"
# Compact 70 um peak at 14:44:56.27 -59:48:00.6.
center_arcmin = [-1.078, -0.372]
size_arcsec = 40.0
label = "high-mass protostellar object"
# Callout from the box's upper-right corner: diagonal leg [dx, dy], then a
# horizontal arm to the label (arcmin).
leader_arcmin = [0.35, 0.45]
arm_arcmin = 0.35

[[panels.annotations]]
kind = "bracket"
# Young region (regions/trichotomy/trichotomy_young.reg), which the spine
# enters at x ~ +2.1 to +2.7 arcmin, up to the end of the dark lane.
x_range_arcmin = [2.2, 6.6]
y_arcmin = -1.25
tick_arcmin = 0.25
label = "infrared dark cloud"

[[panels.annotations]]
kind = "bracket"
# The ring: radio/5.8 um shell from its eastern edge to the western rim.
x_range_arcmin = [-5.9, -2.3]
y_arcmin = -1.25
tick_arcmin = 0.25
label = "H II region"

[[panels]]
name = "fir"
label = "Herschel 250 µm"
kind = "single"
input = "data/delivered/archive/infrared/image_HHLI-SPIRE250.fits"
# SPIRE saturates on the brightest emission; fill those NaN holes.
fill_holes = true
cmap = "afmhot"
low_percentile = 0.5
high_percentile = 99.9
asinh_softening = 0.2

[[panels]]
name = "mm"
label = "ALMA 12m+7m+TP  1.3 mm"
kind = "single"
# Delivered J-comb 12m+7m + dust + free-free TP (combine_continuum),
# extended36: beyond the mosaic the TP model alone, continued past the Paper I
# dust model with the 18"+36" SED maps, so the strip has no gaps. Jy/beam,
# converted to MJy/sr. Optionally restrict it with mask_input (a primary-beam
# image) and mask_minimum (e.g. 0.20).
input = "data/delivered/alma/continuum/IRDC316.8.TP7MTM2TM1.robust0.5.cont.image.pbcor.extended36.fits"
to_mjysr = true
# The strip reaches beyond the 12m+7m grid. Fill those pixels with the
# synthesize_continuum TP model that the extended36 product contains beyond
# the mosaic (same model, factor 1.0, so the two join without a fit).
gap_fill_input = "results/synthesize_continuum/model/continuum_224GHz_fill36.fits"
# Display only: cross-fade from the TP model to the combined image as the
# 12m+7m mosaic primary beam rises from 0.2 to 0.5 (cosine weight), so the
# noisy mosaic rim does not end abruptly against the smooth TP-only area.
blend_pb_input = "data/delivered/alma/continuum/IRDC316.8.7MTM2TM1.robust0.5.cont.pb.fits"
blend_pb_range = [0.2, 0.5]
# Inferno, square-root stretch from 0 to 1200 MJy/sr: the Fig. 3 view of
# tasks/plot_allscale_continuum ([styles.sqrt]).
style = "sqrt"
cmap = "inferno"
vmin = 0.0
vmax = 1200.0
label_colour = "white"

[[panels]]
name = "radio"
label = "MeerKAT  1.38 GHz"
kind = "single"
input = "data/delivered/archive/radio/MeerKAT_subimage_1.38GHz_reprojected.fits"
cmap = "bone"
# Put the noise floor (~half of the strip) at black.
low_percentile = 40.0
high_percentile = 99.9
asinh_softening = 0.03

[figure]
# A&A full text width (17 cm), so labels at label_fontsize print at that size.
width_inches = 6.7
panel_gap_inches = 0.03
dpi = 450
formats = ["png", "pdf"]
label_fontsize = 12
# Scale bar on the bottom panel (d = 2.8 kpc; 0.02 deg = 1 pc as elsewhere).
scalebar_length_deg = 0.02
scalebar_label = "1 pc"
# Small N/E arrows on the top panel, since the grid is rotated.
compass = true
