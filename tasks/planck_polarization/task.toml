[task]
name = "planck_polarization"

[inputs]
stokes_i = "data/delivered/archive/planck/PLCKI_G316.769-0.003_353GHz.fits"
stokes_q = "data/delivered/archive/planck/PLCKQ_G316.769-0.003_353GHz.fits"
stokes_u = "data/delivered/archive/planck/PLCKU_G316.769-0.003_353GHz.fits"

[outputs]
root = "results/planck_polarization"

[noise]
# Adopted rms of the Stokes I and Q/U maps (K_CMB).
rms_i_kcmb = 1.0e-2
rms_qu_kcmb = 3.0e-4

[thresholds]
intensity_snr = [2.0, 3.0]
polarized_snr = [2.0, 3.0]
angle_polarized_snr = 2.0
fraction_intensity_snr = 3.0

[plot]
formats = ["pdf", "png"]
dpi = 300
width_inches = 7.0
height_inches = 6.0
colormap = "BuPu"
vmin_kcmb = 1.0e-2
vmax_kcmb = 0.42
# Zoom: square box centred on the field (G316.769-0.003).
view_center_glon_deg = 316.7686
view_center_glat_deg = -0.003
view_size_arcmin = 30.0
# Planck 353 GHz beam: Planck 2018 effective FWHM, 4.82' (confirmed by the
# author; the delivered HEALPix cut-outs carry no beam keyword). Vectors every half beam, rounded
# to whole 1' pixels; each vector spans vector_length_fraction of the step.
beam_fwhm_arcmin = 4.82
vector_spacing_beam = 0.5
vector_length_fraction = 0.85
vector_color = "#F4DE00"
vector_line_width = 1.8
vector_outline_width = 1.5
vector_outline_color = "black"
